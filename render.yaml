services:
  - type: web
    name: aspl-backend-api
    env: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate
    startCommand: node node_modules/tsx/dist/cli.mjs src/server/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 10000
      - key: APP_URL
        value: https://idyllic-youtiao-34126e.netlify.app
      - key: TOURNAMENT_NAME
        value: "ASPL Cricket Tournament 2026"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_ENVIRONMENT
        value: sandbox
      - key: CASHFREE_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_PROVIDER
        value: MOCK
