services:
  - type: web
    name: ipl-web-api-server
    env: node
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push && node node_modules/tsx/dist/cli.mjs scripts/seed-test-data.ts && node node_modules/tsx/dist/cli.mjs scripts/ensure-admin.ts
    startCommand: node node_modules/tsx/dist/cli.mjs src/server/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        value: aspl-2026-production-super-secret-jwt-key
      - key: APP_URL
        value: https://idyllic-youtiao-34126e.netlify.app
      - key: DATABASE_URL
        value: "file:./dev.db"
